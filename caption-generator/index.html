<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');

:root {
    --gold: #FFD700;
    --gold-2: #FFC700;
    --gold-dim: rgba(255, 215, 0, .12);
    --gold-border: rgba(255, 215, 0, .28);
    --bg-0: #060606;
    --bg-1: #0e0e0e;
    --bg-2: #171717;
    --bg-3: #222;
    --bg-card: #111;
    --t1: #f0f0f0;
    --t2: #aaa;
    --t3: #666;
    --border: #252525;
    --error: #f87171;
    --success: #4ade80;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-0);
    color: var(--t1);
    min-height: 100vh;
}

.page {
    padding: 36px 40px;
    max-width: 1200px;
    margin: 0 auto;
}

.ph {
    margin-bottom: 32px;
}

.ph h1 {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -.5px;
}

.ph p {
    color: var(--t2);
    margin: 0;
    font-size: 16px;
}

/* Form Styles */
.cg-form-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 40px;
}

.fg {
    margin-bottom: 24px;
}

.fl {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--t2);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.fi {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--t1);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: all .2s;
}

.fi:focus {
    border-color: var(--gold-border);
    box-shadow: 0 0 0 3px rgba(255, 215, 0, .07);
}

/* Platform & Tone Toggles */
.plat-toggles {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.plat-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-0);
    color: var(--t2);
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
}

.plat-toggle:hover {
    border-color: var(--gold-border);
    color: var(--t1);
}

.plat-toggle.on {
    border-color: var(--gold);
    background: var(--gold-dim);
    color: var(--gold);
}

.plat-toggle input {
    display: none;
}

/* Button Styles */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all .2s;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #0a0a0a;
    box-shadow: 0 4px 16px rgba(255, 215, 0, .22);
    width: 100%;
}

.gold:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(255, 215, 0, .38);
}

.gold:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.ghost {
    background: transparent;
    border: 1px solid var(--gold-border);
    color: var(--gold);
}

.ghost:hover {
    background: var(--gold-dim);
}

/* Results Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    margin-top: 32px;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all .2s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.card:hover {
    border-color: var(--gold-border);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
}

.card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: transparent;
    transition: background .25s;
}

.card:hover::after {
    background: linear-gradient(90deg, var(--gold), transparent);
}

.badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
    background: var(--gold-dim);
    color: var(--gold);
    width: fit-content;
}

.cg-line {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
}

.cg-line:last-child {
    border-bottom: none;
}

.cg-line span {
    font-size: 14px;
    line-height: 1.5;
    color: var(--t1);
}

.copy-btn {
    background: none;
    border: none;
    color: var(--t3);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all .15s;
    flex-shrink: 0;
}

.copy-btn:hover {
    color: var(--gold);
    background: var(--bg-3);
}

/* Error & Loading */
.cg-error {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 16px;
    color: var(--error);
    margin-bottom: 24px;
    display: none;
    align-items: center;
    gap: 12px;
}

.cg-error.show { display: flex; }

.cg-loading {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 20px;
}

.cg-loading.show { display: flex; }

.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--bg-3);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.cg-loading p {
    color: var(--gold);
    font-weight: 600;
    font-size: 14px;
}

.results-section {
    display: none;
}

.results-section.show {
    display: block;
}

.reset-container {
    margin-top: 40px;
    display: flex;
    justify-content: center;
}
</style>

<div class="page">

    <div class="cg-form-card">

            </div>

                <label class="fl">Tone</label>

                    <label class="plat-toggle on" for="tone-casual">

                        Casual
                    </label>
                    <label class="plat-toggle" for="tone-professional">
                        <input type="radio" id="tone-professional" name="tone" value="Professional" onchange="updateToggleUI(this, 'tone')">
                        Professional
                    </label>
                    <label class="plat-toggle" for="tone-witty">
                        <input type="radio" id="tone-witty" name="tone" value="Witty" onchange="updateToggleUI(this, 'tone')">
                        Witty
                    </label>
                </div>
            </div>

            <div class="fg">
                <label class="fl">What to Generate</label>
                <div class="plat-toggles">
                    <label class="plat-toggle on" for="hooks">
                        <input type="checkbox" id="hooks" name="types" value="Hooks" checked onchange="this.parentElement.classList.toggle('on', this.checked)">
                        Hooks
                    </label>
                    <label class="plat-toggle on" for="captions">
                        <input type="checkbox" id="captions" name="types" value="Captions" checked onchange="this.parentElement.classList.toggle('on', this.checked)">
                        Captions
                    </label>
                    <label class="plat-toggle on" for="ctas">
                        <input type="checkbox" id="ctas" name="types" value="CTAs" checked onchange="this.parentElement.classList.toggle('on', this.checked)">
                        CTAs
                    </label>
                    <label class="plat-toggle on" for="hashtags">
                        <input type="checkbox" id="hashtags" name="types" value="Hashtags" checked onchange="this.parentElement.classList.toggle('on', this.checked)">
                        Hashtags
                    </label>
                </div>
            </div>

            <div class="fg">
                <label class="fl">Number of Variations</label>
                <input type="number" id="variations" class="fi" min="1" max="10" value="5">
            </div>

            <button type="submit" class="btn gold" id="generateBtn">Generate Content</button>
        </form>
    </div>

    <div id="loadingSpinner" class="cg-loading">
        <div class="spinner"></div>
        <p>AI is crafting your content...</p>
    </div>

    <div id="resultsSection" class="results-section">
        <div class="grid" id="captionsList"></div>
        <div class="reset-container">
            <button class="btn ghost" id="resetBtn" style="width: auto;">Start New Generation</button>
        </div>
    </div>
</div>

<script>
// Helper for UI Toggles
function updateToggleUI(input, name) {
    if (input.type === 'radio') {
        document.querySelectorAll(`input[name="${name}"]`).forEach(inp => {
            inp.parentElement.classList.toggle('on', inp.checked);
        });
    }
}

// ==== CONFIG ====
const CONFIG={};

// ==== ELEMENTS ====
const form=document.getElementById('captionForm');
const generateBtn=document.getElementById('generateBtn');
const resetBtn=document.getElementById('resetBtn');
const resultsSection=document.getElementById('resultsSection');
const captionsList=document.getElementById('captionsList');
const errorMessage=document.getElementById('errorMessage');
const errorText=document.getElementById('errorText');
const loadingSpinner=document.getElementById('loadingSpinner');

form.addEventListener('submit',handleFormSubmit);
resetBtn.addEventListener('click',resetForm);

async function handleFormSubmit(e){
    e.preventDefault();
    const topic=document.getElementById('topic').value.trim();
    const platform=document.querySelector('input[name="platform"]:checked').value;
    const tone=document.querySelector('input[name="tone"]:checked').value;
    const variations=parseInt(document.getElementById('variations').value);
    const types=[...document.querySelectorAll('input[name="types"]:checked')].map(c=>c.value);
    
    if(types.length===0){showError('Select at least one type.');return;}
    
    showLoading(true);
    hideError();
    resultsSection.classList.remove('show');
    
    try{
        const result=await generateCaptions(topic,platform,tone,variations,types);
        displayAll(result);
        resultsSection.classList.add('show');
    }catch(err){
        showError(err.message);
    }finally{
        showLoading(false);
    }
}

async function generateCaptions(topic,platform,tone,variations,types){
    const prompt=`Generate exactly ${variations} numbered items for each selected type (${types.join(', ')}) for ${platform}. Topic: "${topic}". Tone: ${tone}. Number each item for each type.`;
    const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,task:'caption'})});
    if(!res.ok) throw new Error('Generation failed. Please try again.');
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    return parseSections(data.text,variations,types);
}

function parseSections(content,expectedCount,types){
    const lines=content.split('\n').map(l=>l.trim()).filter(l=>l&&/^\d/.test(l)).map(l=>l.replace(/^\d+[\.\)\-\s]+/,'').trim());
    const sections={};
    let perType=Math.ceil(lines.length/types.length);
    types.forEach((t,i)=>{sections[t]=lines.slice(i*perType,(i+1)*perType).slice(0,expectedCount);while(sections[t].length<expectedCount) sections[t].push(`No ${t} generated.`);});
    return sections;
}

function displayAll(results){
    captionsList.innerHTML='';
    for(const type in results){
        const card=document.createElement('div'); card.className='card';
        card.innerHTML=`<div class="badge">${type}</div><div class="card-content"></div>`;
        const contentDiv=card.querySelector('.card-content');
        results[type].forEach((line,i)=>{
            const lineEl=document.createElement('div');lineEl.className='cg-line';
            lineEl.innerHTML=`<span>${i+1}. ${escapeHtml(line)}</span><button class="copy-btn">Copy</button>`;
            lineEl.querySelector('button').addEventListener('click',function(){
                navigator.clipboard.writeText(line);
                this.innerText='Copied!';
                this.style.color='var(--success)';
                setTimeout(()=>{
                    this.innerText='Copy';
                    this.style.color='var(--t3)';
                },1000);
            });
            contentDiv.appendChild(lineEl);
        });
        captionsList.appendChild(card);
    }
}

function escapeHtml(text){const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};return text.replace(/[&<>"']/g,m=>map[m]);}
function resetForm(){form.reset();resultsSection.classList.remove('show');hideError();document.querySelectorAll('.plat-toggle').forEach(t=>{const inp=t.querySelector('input');t.classList.toggle('on', inp.checked);});}
function showLoading(show){loadingSpinner.classList.toggle('show',show);generateBtn.disabled=show;}
function showError(msg){errorText.textContent=msg;errorMessage.classList.add('show');}
function hideError(){errorMessage.classList.remove('show');}
</script>
